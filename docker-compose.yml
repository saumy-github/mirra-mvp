services:
  backend:
    build:
      context: .
      dockerfile: website/backend/Dockerfile
    env_file:
      - website/backend/.env.docker.dev
    ports:
      - "8000:8000"
    volumes:
      - ./website/backend/src:/app/website/backend/src
      # Both roots mounted so APP_ENV resolves the same way it does for the worker.
      # Read-write: the API writes uploads here for the worker to pick up
      # (merchant captures, shopper measurement photos); it was :ro, which made
      # every upload fail inside the container.
      - ./dev_upload:/app/dev_upload
      - ./live_upload:/app/live_upload
    command: ["uvicorn", "src.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    restart: unless-stopped
    depends_on:
      - redis

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_dev_data:/data
    restart: unless-stopped

volumes:
  redis_dev_data:
